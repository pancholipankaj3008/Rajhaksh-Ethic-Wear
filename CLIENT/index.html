<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Mobile Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Rajhaksh Ethic Wear | Traditional & Elegant Ethnic Fashion</title>

    <meta
      name="description"
      content="Discover Rajhaksh Ethic Wear — premium traditional and ethnic fashion designed with elegance, comfort, and timeless style."
    />

    <meta
      name="keywords"
      content="Rajhaksh Ethic Wear, ethnic wear, traditional wear, Indian fashion, kurta, ethnic fashion, men's ethnic wear"
    />

    <meta name="author" content="Rajhaksh Ethic Wear" />

    <!-- Theme -->
    <meta name="theme-color" content="#111111" />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="Rajhaksh Ethic Wear | Traditional & Elegant Ethnic Fashion"
    />

    <meta
      property="og:description"
      content="Explore premium ethnic and traditional fashion from Rajhaksh Ethic Wear."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://rajhakshethicwear.vercel.app/"
    />

    <meta
      property="og:image"
      content="https://rajhakshethicwear.vercel.app/og-image.jpg"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Rajhaksh Ethic Wear"
    />

    <meta
      name="twitter:description"
      content="Premium ethnic fashion with timeless Indian elegance."
    />

    <meta
      name="twitter:image"
      content="https://rajhakshethicwear.vercel.app/og-image.jpg"
    />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
